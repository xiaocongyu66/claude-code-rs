[package]
name = "claude-code-rs"
version = "2.8.4"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/xiaocongyu66/claude-code-rs"
publish = false

# The main binary mirrors src/entrypoints/cli.tsx: fast-path dispatch before
# the full CLI loads.
[[bin]]
name = "cch"
path = "src/entrypoints/cli.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
