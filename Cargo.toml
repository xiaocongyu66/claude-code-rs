[package]
name = "claude-code-rs"
version = "2.8.4"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/xiaocongyu66/claude-code-rs"
publish = false

# The main binary mirrors src/entrypoints/cli.tsx: fast-path dispatch before
# the full CLI loads.
[[bin]]
name = "cch"
path = "src/entrypoints/cli.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
once_cell = "1"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "fs", "process", "io-util", "sync"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
